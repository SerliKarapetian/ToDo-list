<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="todo-list">
        <header>
          <h1><i class="fas fa-tasks"></i> To-Do List</h1>
          <div class="stats" aria-live="polite">
            <span id="task-count">0</span> tasks remaining
          </div>
        </header>
        <div class="input-section">
          <div class="input-wrapper">
            <input
              type="text"
              id="input-box"
              placeholder="Add your task"
              maxlength="100"
              aria-label="Add new task"
            />
            <button id="add-btn" aria-label="Add task">
              <i class="fas fa-plus"></i>
            </button>
          </div>
        </div>
        <ul id="list-container" role="list" aria-label="Task list"></ul>
      </div>
    </div>
    <div class="credits">
      <p>
        Open-source code by
        <a
          href="https://github.com/SerliKarapetian/ToDo-list"
          target="_blank"
          rel="noopener"
          >Serli</a
        >
      </p>
    </div>
    <script src="./assets/script.js"></script>
  </body>
</html>
