<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b2137" />
    <meta
      name="description"
      content="A beautifully simple to-do list to organize your day."
    />
    <title>To-Do · Organize your day</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <div class="brand">
          <div class="brand__icon" aria-hidden="true">
            <i class="fas fa-check-double"></i>
          </div>
          <div>
            <h1>My Tasks</h1>
            <p class="brand__subtitle" id="today-label">
              Let's get things done
            </p>
          </div>
        </div>

        <div class="progress" aria-live="polite">
          <svg viewBox="0 0 36 36" class="progress__ring" aria-hidden="true">
            <circle class="progress__track" cx="18" cy="18" r="15.9" />
            <circle
              class="progress__fill"
              id="progress-fill"
              cx="18"
              cy="18"
              r="15.9"
            />
          </svg>
          <span class="progress__label" id="progress-label">0%</span>
        </div>
      </header>

      <form class="composer" id="composer" autocomplete="off">
        <i class="fas fa-pen composer__icon" aria-hidden="true"></i>
        <label for="input-box" class="sr-only">Add new task</label>
        <input
          type="text"
          id="input-box"
          placeholder="What needs to be done?"
          maxlength="100"
          aria-label="Add new task"
        />
        <button type="submit" id="add-btn" aria-label="Add task">
          <i class="fas fa-arrow-up" aria-hidden="true"></i>
        </button>
      </form>

      <nav class="filters" aria-label="Filter tasks">
        <button class="filter is-active" data-filter="all" type="button">
          All
        </button>
        <button class="filter" data-filter="active" type="button">
          Active
        </button>
        <button class="filter" data-filter="completed" type="button">
          Done
        </button>
      </nav>

      <p class="hint">
        <i class="fas fa-clock" aria-hidden="true"></i>
        Done tasks are cleared after 1 week
      </p>

      <ul
        id="list-container"
        class="tasks"
        role="list"
        aria-label="Task list"
      ></ul>

      <div class="empty" id="empty-state" hidden>
        <div class="empty__art" aria-hidden="true">
          <i class="fas fa-mug-hot"></i>
        </div>
        <h2 class="empty__title" id="empty-title">All clear!</h2>
        <p class="empty__text" id="empty-text">Add your first task above.</p>
      </div>

      <footer class="credits">
        <p>
          Built by
          <a
            href="https://github.com/SerliKarapetian/ToDo-list"
            target="_blank"
            rel="noopener noreferrer"
            >Serli</a
          >
        </p>
      </footer>
    </main>

    <script src="./assets/script.js" defer></script>
  </body>
</html>
